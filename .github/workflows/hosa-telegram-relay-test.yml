name: HOSA Telegram Relay Test

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: "Opaque test identifier; letters, digits, underscore, and hyphen only"
        required: true
        default: "hosa-relay-test-001"
      expires_seconds:
        description: "Polling window in seconds (30-120)"
        required: true
        default: "90"

permissions:
  contents: read

concurrency:
  group: hosa-telegram-relay
  cancel-in-progress: false

jobs:
  relay-test:
    name: Non-trading Telegram relay test
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CORRELATION_ID: ${{ inputs.correlation_id }}
      EXPIRES_SECONDS: ${{ inputs.expires_seconds }}
    steps:
      - name: Validate local workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CORRELATION_ID" =~ ^[A-Za-z0-9_-]{6,64}$ ]]; then
            echo "Invalid correlation ID."
            exit 1
          fi
          if [[ ! "$EXPIRES_SECONDS" =~ ^[0-9]+$ ]] || (( EXPIRES_SECONDS < 30 || EXPIRES_SECONDS > 120 )); then
            echo "Expiration window must be an integer from 30 to 120 seconds."
            exit 1
          fi
          if [[ -z "${BOT_TOKEN:-}" || -z "${CHAT_ID:-}" ]]; then
            echo "Required GitHub Actions secrets are missing."
            exit 1
          fi

      - name: Verify Telegram access without logging API responses
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --max-time 20 "https://api.telegram.org/bot${BOT_TOKEN}/getMe")" || {
            echo "Telegram reachability check failed."
            exit 1
          }
          if ! printf '%s' "$response" | python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin).get("ok") is True else 1)'; then
            echo "Telegram identity check failed."
            exit 1
          fi
          echo "Telegram relay reachability: PASS"

      - name: Send non-trading inline approval test
        shell: bash
        run: |
          set -euo pipefail
          keyboard="{\"inline_keyboard\":[[{\"text\":\"APPROVE TEST\",\"callback_data\":\"hosa-relay:${CORRELATION_ID}:approve\"},{\"text\":\"REJECT TEST\",\"callback_data\":\"hosa-relay:${CORRELATION_ID}:reject\"}]]}"
          message="HOSA TELEGRAM RELAY TEST\nThis is a non-trading transport test.\nTap APPROVE TEST or REJECT TEST within ${EXPIRES_SECONDS} seconds.\nNo Toobit order can be created by this workflow."
          response="$(curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${message}" --data-urlencode "reply_markup=${keyboard}")" || {
            echo "Telegram test message delivery failed."
            exit 1
          }
          if ! printf '%s' "$response" | python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin).get("ok") is True else 1)'; then
            echo "Telegram test message was rejected."
            exit 1
          fi
          echo "Non-trading approval test delivered."

      - name: Poll a single callback without logging Telegram updates
        id: relay
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + EXPIRES_SECONDS ))
          offset=""
          decision="EXPIRED"
          while (( $(date +%s) < deadline )); do
            args=(--silent --show-error --fail --max-time 20 --get "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" --data-urlencode "timeout=10" --data-urlencode 'allowed_updates=["callback_query"]')
            if [[ -n "$offset" ]]; then
              args+=(--data-urlencode "offset=${offset}")
            fi
            updates="$(curl "${args[@]}")" || {
              echo "Telegram callback polling failed."
              exit 1
            }
            export HOSA_UPDATES_JSON="$updates"
            metadata="$(python3 - "$CHAT_ID" "$CORRELATION_ID" <<'PY'
import json, os, sys
chat_id, correlation_id = sys.argv[1], sys.argv[2]
try:
    payload = json.loads(os.environ.get("HOSA_UPDATES_JSON", "{}"))
except json.JSONDecodeError:
    print("\t\t")
    raise SystemExit(0)
last_offset = ""
decision = ""
callback_id = ""
for update in payload.get("result", []):
    update_id = update.get("update_id")
    if isinstance(update_id, int):
        last_offset = str(update_id + 1)
    callback = update.get("callback_query") or {}
    source_chat = str(((callback.get("message") or {}).get("chat") or {}).get("id", ""))
    data = str(callback.get("data", ""))
    if source_chat != chat_id:
        continue
    if data == f"hosa-relay:{correlation_id}:approve":
        decision, callback_id = "APPROVED", str(callback.get("id", ""))
        break
    if data == f"hosa-relay:{correlation_id}:reject":
        decision, callback_id = "REJECTED", str(callback.get("id", ""))
        break
print(f"{last_offset}\t{decision}\t{callback_id}")
PY
)"
            IFS=$'\t' read -r next_offset candidate callback_id <<< "$metadata"
            if [[ -n "$next_offset" ]]; then offset="$next_offset"; fi
            if [[ -n "$candidate" ]]; then
              decision="$candidate"
              if [[ -n "$callback_id" ]]; then
                curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/answerCallbackQuery" --data-urlencode "callback_query_id=${callback_id}" --data-urlencode "text=HOSA relay test recorded: ${decision}" >/dev/null
              fi
              break
            fi
          done
          printf '{"correlation_id":"%s","decision":"%s","mode":"NON_TRADING_TEST"}\n' "$CORRELATION_ID" "$decision" > relay-result.json
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          echo "Relay decision recorded: ${decision}"

      - name: Store non-sensitive relay result
        uses: actions/upload-artifact@v4
        with:
          name: hosa-relay-result-${{ inputs.correlation_id }}
          path: relay-result.json
          if-no-files-found: error
          retention-days: 1

      - name: End non-trading relay test
        shell: bash
        run: |
          set -euo pipefail
          decision="${{ steps.relay.outputs.decision }}"
          if [[ "$decision" == "APPROVED" || "$decision" == "REJECTED" ]]; then
            echo "Relay test completed: ${decision}"
            exit 0
          fi
          echo "Relay test expired without a button response."
          exit 2
