name: HOSA Telegram Manual Smoke Test

on: [workflow_dispatch]

permissions: {}

jobs:
  relay-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BOT_TOKEN:-}" || -z "${CHAT_ID:-}" ]]; then
            echo "Required GitHub Actions secrets are missing."
            exit 1
          fi

      - name: Send a non-trading Telegram relay test
        id: send
        shell: bash
        run: |
          set -euo pipefail
          code="$(date +%s)"
          message="HOSA TELEGRAM MANUAL SMOKE TEST\nThis is a non-trading connectivity test.\nReply exactly with: OK ${code}\nNo HOSA, Toobit, order, capital, or Live system is used."
          response="$(curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${message}")" || {
            echo "Telegram test message delivery failed."
            exit 1
          }
          if ! printf '%s' "$response" | jq -e '.ok == true' >/dev/null; then
            echo "Telegram rejected the test message."
            exit 1
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "Test message delivered."

      - name: Wait for the matching mobile reply
        shell: bash
        env:
          CODE: ${{ steps.send.outputs.code }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 90 ))
          offset=""
          matched="false"
          while (( $(date +%s) < deadline )); do
            args=(--silent --show-error --fail --max-time 20 --get "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" --data-urlencode "timeout=10")
            if [[ -n "$offset" ]]; then args+=(--data-urlencode "offset=${offset}"); fi
            updates="$(curl "${args[@]}")" || { echo "Telegram reply polling failed."; exit 1; }
            next_offset="$(printf '%s' "$updates" | jq -r '[.result[]?.update_id] | if length == 0 then "" else (max + 1 | tostring) end')"
            if [[ -n "$next_offset" ]]; then offset="$next_offset"; fi
            expected="OK ${CODE}"
            matched="$(printf '%s' "$updates" | jq -r --arg chat "$CHAT_ID" --arg expected "$expected" 'any(.result[]?; (((.message.chat.id? // "") | tostring) == $chat) and ((.message.text? // "") == $expected))')"
            if [[ "$matched" == "true" ]]; then break; fi
          done
          if [[ "$matched" != "true" ]]; then
            echo "Relay test expired without the matching reply."
            exit 2
          fi
          echo "Telegram relay send and receive: PASS"
