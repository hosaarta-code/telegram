name: SAMAR Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Test Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "================================"
          echo "SAMAR TELEGRAM RELAY TEST"
          echo "================================"

          echo ""
          echo "[1] Testing Telegram API..."

          ME=$(curl -sS --max-time 20 \
            "https://api.telegram.org/bot${BOT_TOKEN}/getMe")

          echo "$ME"

          if ! echo "$ME" | grep -q '"ok":true'; then
            echo "TELEGRAM API CONNECTION FAILED"
            exit 1
          fi

          echo "Telegram API: OK"

          echo ""
          echo "[2] Sending test message..."

          SEND=$(curl -sS --max-time 20 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🔔 SAMAR TEST

این پیام از GitHub Relay ارسال شده است.

لطفاً در Telegram همین پیام را با OK پاسخ بده.

⏳ منتظر پاسخ هستیم...")

          echo "$SEND"

          if ! echo "$SEND" | grep -q '"ok":true'; then
            echo "MESSAGE SEND FAILED"
            exit 1
          fi

          echo "MESSAGE SEND: OK"

          echo ""
          echo "[3] Waiting for Telegram reply..."
          echo "Reply with: OK"

          OFFSET=""
          START=$(date +%s)

          while true; do

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))

            if [ "$ELAPSED" -ge 90 ]; then
              echo ""
              echo "TIMEOUT - No OK received."
              exit 2
            fi

            if [ -z "$OFFSET" ]; then
              UPDATES=$(curl -sS --max-time 15 \
                "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?timeout=5")
            else
              UPDATES=$(curl -sS --max-time 15 \
                "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${OFFSET}&timeout=5")
            fi

            echo "$UPDATES"

            LAST_ID=$(echo "$UPDATES" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',[]); print(r[-1]['update_id'] if r else '')")

            if [ -n "$LAST_ID" ]; then
              OFFSET=$((LAST_ID + 1))
            fi

            MATCH=$(echo "$UPDATES" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for u in d.get('result',[]):
              m=u.get('message',{})
              text=m.get('text','').strip().upper()
              chat=str(m.get('chat',{}).get('id',''))
              if chat == '${CHAT_ID}' and text == 'OK':
                  print('YES')
                  break
          " )

            if [ "$MATCH" = "YES" ]; then
              echo ""
              echo "================================"
              echo "SUCCESS"
              echo "================================"
              echo "Telegram SEND    : OK"
              echo "Telegram RECEIVE : OK"
              echo "VPN              : NOT USED"
              echo ""
              echo "🎯 SAMAR Telegram Relay works."
              exit 0
            fi

            sleep 2
          done
