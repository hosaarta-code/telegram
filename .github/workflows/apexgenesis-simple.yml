name: APEXGenesis Simple Approval
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to send'
        required: true
        type: string
permissions:
  contents: read
jobs:
  send-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Send approval message with buttons
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${{ github.event.inputs.message }}" \
            -d "parse_mode=Markdown" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"✅ APPROVE\",\"callback_data\":\"approve_$(date +%s)\"},{\"text\":\"❌ REJECT\",\"callback_data\":\"reject_$(date +%s)\"}]]}"
