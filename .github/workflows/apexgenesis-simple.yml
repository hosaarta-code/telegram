name: APEXGenesis Telegram Approval

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to send (HTML, no emoji in button text)'
        required: true
        type: string
      approval_id:
        description: 'Approval ID (e.g., 8_cycle)'
        required: true
        type: string

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Send message with clean inline keyboard
        run: |
          # Create callback data
          APPROVE_DATA="approve_${{ github.event.inputs.approval_id }}"
          REJECT_DATA="reject_${{ github.event.inputs.approval_id }}"

          # Send message with clean keyboard (APPROVE / REJECT only)
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${{ github.event.inputs.message }}" \
            -d "parse_mode=HTML" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"APPROVE\",\"callback_data\":\"${APPROVE_DATA}\"},{\"text\":\"REJECT\",\"callback_data\":\"${REJECT_DATA}\"}]]}"
