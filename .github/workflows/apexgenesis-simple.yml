name: APEXGenesis Telegram Approval

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to send'
        required: true
        type: string
      approval_id:
        description: 'Approval ID'
        required: true
        type: string

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Send message with inline keyboard
        run: |
          # Create callback data
          APPROVE_DATA="approve_${{ github.event.inputs.approval_id }}"
          REJECT_DATA="reject_${{ github.event.inputs.approval_id }}"
          
          # Send message with inline keyboard
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${{ github.event.inputs.message }}" \
            -d "parse_mode=Markdown" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"✅ Approve\",\"callback_data\":\"${APPROVE_DATA}\"},{\"text\":\"❌ Reject\",\"callback_data\":\"${REJECT_DATA}\"}]]}"