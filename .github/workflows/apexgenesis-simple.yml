name: APEXGenesis Approval with Buttons

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to send'
        required: true
        type: string
      approve_id:
        description: 'Approval ID for this signal'
        required: false
        type: string
        default: 'test'

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Send message with inline keyboard
        run: |
          # Send message with inline keyboard buttons
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${{ github.event.inputs.message }}" \
            -d "parse_mode=Markdown" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"✅ Approve\",\"callback_data\":\"approve_${{ github.event.inputs.approve_id }}\"},{\"text\":\"❌ Reject\",\"callback_data\":\"reject_${{ github.event.inputs.approve_id }}\"}]]}"
