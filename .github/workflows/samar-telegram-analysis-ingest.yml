name: SAMAR Telegram Approval Relay
run-name: SAMAR relay ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: Opaque SAMAR approval identifier
        required: true
        type: string
      correlation_id:
        description: One-time local correlation identifier
        required: true
        type: string
      expires_at_ms:
        description: Local approval expiry in Unix milliseconds
        required: true
        type: string
      mode:
        description: PAPER or LIVE label only
        required: true
        type: choice
        options: [PAPER, LIVE]
      contract:
        description: USDT-M contract label only
        required: true
        type: string
      direction:
        description: LONG or SHORT label only
        required: true
        type: choice
        options: [LONG, SHORT]
      position_size_usdt:
        description: Size in USDT
        required: false
        type: string
      risk_usdt:
        description: Max risk in USDT
        required: false
        type: string
      leverage:
        description: Leverage label only
        required: false
        type: string
      entry_price:
        description: Entry reference
        required: false
        type: string
      stop_loss:
        description: Protective stop
        required: false
        type: string
      take_profit:
        description: Take-profit reference
        required: false
        type: string
      message_type:
        description: APPROVAL renders trade buttons; MATERIAL_CHANGE renders governed-change buttons; NOTICE sends a button-free status/report message
        required: false
        type: choice
        default: APPROVAL
        options: [APPROVAL, MATERIAL_CHANGE, NOTICE]
      notification_text:
        description: Button-free status or report text for NOTICE messages
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/samar-telegram-relay.yml
      - .github/workflows/samar-telegram-analysis-ingest.yml
      - .github/workflows/samar-telegram-approval-relay.yml

permissions:
  contents: write

jobs:
  telegram-approval-relay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      APPROVAL_ID: ${{ inputs.approval_id }}
      CORRELATION_ID: ${{ inputs.correlation_id }}
      EXPIRES_AT_MS: ${{ inputs.expires_at_ms }}
      MODE: ${{ inputs.mode }}
      CONTRACT: ${{ inputs.contract }}
      DIRECTION: ${{ inputs.direction }}
      POSITION_SIZE_USDT: ${{ inputs.position_size_usdt }}
      RISK_USDT: ${{ inputs.risk_usdt }}
      LEVERAGE: ${{ inputs.leverage }}
      ENTRY_PRICE: ${{ inputs.entry_price }}
      STOP_LOSS: ${{ inputs.stop_loss }}
      TAKE_PROFIT: ${{ inputs.take_profit }}
      MESSAGE_TYPE: ${{ inputs.message_type }}
      NOTIFICATION_TEXT: ${{ inputs.notification_text }}
    steps:
      - name: Validate relay inputs and GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BOT_TOKEN:-}" && -n "${CHAT_ID:-}" ]] || { echo "GitHub Telegram relay secrets are missing."; exit 1; }
          [[ "$APPROVAL_ID" =~ ^[A-Za-z0-9_-]{10,64}$ ]] || { echo "Approval identifier is malformed."; exit 1; }
          [[ "$CORRELATION_ID" =~ ^[A-Za-z0-9_-]{16,64}$ ]] || { echo "Correlation identifier is malformed."; exit 1; }
          [[ "$EXPIRES_AT_MS" =~ ^[0-9]{13}$ ]] || { echo "Expiry is malformed."; exit 1; }

      - name: Send approval buttons and capture one matching reply
        id: relay
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${MESSAGE_TYPE:-APPROVAL}" == "NOTICE" ]]; then
            notice="${NOTIFICATION_TEXT:-SAMAR PAPER notification}"
            sent="$(curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${notice}")" || { echo "Telegram notice delivery failed."; exit 1; }
            printf '%s' "$sent" | jq -e '.ok == true' >/dev/null || { echo "Telegram rejected notice delivery."; exit 1; }
            echo "decision=NOTICE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now_ms="$(date +%s%3N)"
          if (( EXPIRES_AT_MS <= now_ms )); then echo "decision=EXPIRED" >> "$GITHUB_OUTPUT"; exit 0; fi
          initial="$(curl --silent --show-error --fail --max-time 20 --get "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" --data-urlencode "timeout=0")" || { echo "Telegram relay preflight failed."; exit 1; }
          offset="$(printf '%s' "$initial" | jq -r '[.result[]?.update_id] | if length == 0 then "" else (max + 1 | tostring) end')"
          if [[ "${MESSAGE_TYPE:-APPROVAL}" == "MATERIAL_CHANGE" ]]; then
            message="$(printf '%s\n' \
              "SAMAR · درخواست تأیید تغییر مهم PAPER" \
              "────────────────────" \
              "${NOTIFICATION_TEXT:-شرح تغییر موجود نیست}" \
              "شناسه تغییر: ${APPROVAL_ID}" \
              "مهلت: $(date -u -d \"@$((${EXPIRES_AT_MS} / 1000))\" '+%Y-%m-%d %H:%M UTC')" \
              "────────────────────" \
              "تأیید فقط تغییر پیشنهادی را برای مرحلهٔ بعد ثبت می‌کند؛ هیچ معامله یا تغییری در LIVE اجرا نمی‌شود.")"
          else
            message="$(printf '%s\n' \
              "SAMAR · ${MODE}" \
              "────────────────────" \
              "${CONTRACT} · ${DIRECTION}" \
              "Size: ${POSITION_SIZE_USDT:-?} USDT · Risk: ${RISK_USDT:-?} USDT · Lev ${LEVERAGE:-?}x" \
              "Entry: ${ENTRY_PRICE:-?}" \
              "SL: ${STOP_LOSS:-?}" \
              "TP plan: TP1 20% · TP2 25% · TP3 25% · TP4 30%" \
              "TP4 reference: ${TAKE_PROFIT:-?}" \
              "Approval ID: ${APPROVAL_ID}" \
              "Expires: $(date -u -d \"@$((${EXPIRES_AT_MS} / 1000))\" '+%Y-%m-%d %H:%M UTC')" \
              "────────────────────" \
              "APPROVE opens one validated position only. REJECT or expiry opens no position.")"
          fi
          keyboard="$(jq -cn --arg approve "samar:${CORRELATION_ID}:approve" --arg reject "samar:${CORRELATION_ID}:reject" '{inline_keyboard:[[ {text:"APPROVE",callback_data:$approve},{text:"REJECT",callback_data:$reject} ]]}' )"
          sent="$(curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${message}" --data-urlencode "reply_markup=${keyboard}")" || { echo "Telegram approval delivery failed."; exit 1; }
          printf '%s' "$sent" | jq -e '.ok == true' >/dev/null || { echo "Telegram rejected approval delivery."; exit 1; }
          message_id="$(printf '%s' "$sent" | jq -r '.result.message_id // empty')"
          [[ "$message_id" =~ ^[0-9]+$ ]] || { echo "Telegram approval delivery returned no message ID."; exit 1; }
          decision="EXPIRED"
          while (( $(date +%s%3N) < EXPIRES_AT_MS )); do
            args=(--silent --show-error --fail --max-time 20 --get "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" --data-urlencode "timeout=10")
            if [[ -n "$offset" ]]; then args+=(--data-urlencode "offset=${offset}"); fi
            updates="$(curl "${args[@]}")" || { echo "Telegram approval polling failed."; exit 1; }
            next_offset="$(printf '%s' "$updates" | jq -r '[.result[]?.update_id] | if length == 0 then "" else (max + 1 | tostring) end')"
            if [[ -n "$next_offset" ]]; then offset="$next_offset"; fi
            approve="samar:${CORRELATION_ID}:approve"; reject="samar:${CORRELATION_ID}:reject"
            callback="$(printf '%s' "$updates" | jq -r --arg chat "$CHAT_ID" --arg approve "$approve" --arg reject "$reject" '[.result[]?.callback_query | select((((.message.chat.id? // "")|tostring) == $chat) and (((.from.id? // "")|tostring) == $chat) and (.data == $approve or .data == $reject))][0] // empty')"
            if [[ -n "$callback" ]]; then
              callback_id="$(printf '%s' "$callback" | jq -r '.id')"; callback_data="$(printf '%s' "$callback" | jq -r '.data')"
              if [[ "$callback_data" == "$approve" ]]; then decision="APPROVE"; else decision="REJECT"; fi
              curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/answerCallbackQuery" --data-urlencode "callback_query_id=${callback_id}" --data-urlencode "text=SAMAR decision received. Local validation is required." >/dev/null || true
              if [[ "${MESSAGE_TYPE:-APPROVAL}" == "MATERIAL_CHANGE" ]]; then updated_message="$(printf '%s\n' "$message" "وضعیت: ${decision} — تصمیم ثبت شد؛ بررسی محلی و قابل‌ممیزی ادامه دارد.")"; else updated_message="$(printf '%s\n' "$message" "Status: ${decision} — decision captured; local SAMAR validation follows.")"; fi
              empty_keyboard="$(jq -cn '{inline_keyboard:[]}')"
              curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "message_id=${message_id}" --data-urlencode "text=${updated_message}" --data-urlencode "reply_markup=${empty_keyboard}" >/dev/null || { echo "Telegram decision was captured, but the message could not be updated."; }
              break
            fi
          done
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"

      - name: Write minimal decision artifact
        shell: bash
        env:
          DECISION: ${{ steps.relay.outputs.decision }}
        run: |
          set -euo pipefail
          jq -cn --arg approval_id "$APPROVAL_ID" --arg correlation_id "$CORRELATION_ID" --arg decision "$DECISION" '{schema_version:1,approval_id:$approval_id,correlation_id:$correlation_id,decision:$decision}' > decision.json

      - name: Upload minimal decision artifact
        uses: actions/upload-artifact@v4
        with:
          name: samar-relay-${{ inputs.correlation_id }}
          path: decision.json
          if-no-files-found: error
          retention-days: 1

  ingest-analysis-responses:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout inbox state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ingest authorized SAMAR analysis responses
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BOT_TOKEN:-}" && -n "${CHAT_ID:-}" ]] || { echo "Telegram ingest secrets are missing."; exit 1; }
          mkdir -p runtime/command-center-inbox
          offset=0
          if [[ -f runtime/telegram-analysis-offset.txt ]]; then offset="$(cat runtime/telegram-analysis-offset.txt)"; fi
          updates="$(curl --silent --show-error --fail --max-time 30 --get "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" --data-urlencode "timeout=0" --data-urlencode "offset=${offset}")"
          printf '%s' "$updates" | jq -e '.ok == true' >/dev/null
          next_offset="$(printf '%s' "$updates" | jq -r '[.result[]?.update_id] | if length == 0 then "" else (max + 1 | tostring) end')"
          if [[ -n "$next_offset" ]]; then printf '%s' "$next_offset" > runtime/telegram-analysis-offset.txt; fi
          while IFS= read -r update; do
            [[ -n "$update" ]] || continue
            chat="$(printf '%s' "$update" | jq -r '.message.chat.id? // empty')"
            sender="$(printf '%s' "$update" | jq -r '.message.from.id? // empty')"
            text="$(printf '%s' "$update" | jq -r '.message.text? // empty')"
            [[ "$chat" == "$CHAT_ID" && "$sender" == "$CHAT_ID" ]] || continue
            [[ "$text" == /samar_response* ]] || continue
            request_id="$(printf '%s\n' "$text" | sed -n 's#^/samar_response[[:space:]]\+\(cc_req_[A-Za-z0-9_-]\{18\}\).*#\1#p')"
            [[ "$request_id" =~ ^cc_req_[A-Za-z0-9_-]{18}$ ]] || continue
            payload="$(printf '%s\n' "$text" | sed '1d' | sed '/^```[[:alnum:]_-]*[[:space:]]*$/d; /^```[[:space:]]*$/d')"
            printf '%s' "$payload" | jq -e --arg request_id "$request_id" 'type == "object" and .requestId == $request_id' > /tmp/samar-response.json || continue
            jq -cn --arg source "SAMAR_TELEGRAM_RELAY" --arg request_id "$request_id" --arg telegram_user_id "$sender" --slurpfile response /tmp/samar-response.json '{schema_version:1,source:$source,requestId:$request_id,telegramUserId:$telegram_user_id,response:$response[0]}' > "runtime/command-center-inbox/${request_id}.json"
            curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=SAMAR: پاسخ ${request_id} دریافت شد و برای ثبت خودکار ارسال می‌شود." >/dev/null || true
          done < <(printf '%s' "$updates" | jq -c '.result[]?')
          if [[ -n "$next_offset" ]]; then
            git config user.name "SAMAR Telegram Relay"
            git config user.email "samar-telegram-relay@users.noreply.github.com"
            git add runtime/command-center-inbox runtime/telegram-analysis-offset.txt
            git diff --cached --quiet || git commit -m "chore: ingest SAMAR Telegram analysis response"
            git push
          fi
