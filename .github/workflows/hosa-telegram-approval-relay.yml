name: HOSA Telegram Approval Relay

on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: Opaque HOSA approval identifier
        required: true
        type: string
      correlation_id:
        description: One-time opaque local correlation identifier
        required: true
        type: string
      expires_at_ms:
        description: Local HOSA approval expiry in Unix milliseconds
        required: true
        type: string
      mode:
        description: PAPER or LIVE label only
        required: true
        type: choice
        options: [PAPER, LIVE]
      contract:
        description: USDT-M contract label only
        required: true
        type: string
      direction:
        description: LONG or SHORT label only
        required: true
        type: choice
        options: [LONG, SHORT]
permissions:
  contents: read

jobs:
  telegram-approval-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      APPROVAL_ID: ${{ inputs.approval_id }}
      CORRELATION_ID: ${{ inputs.correlation_id }}
      EXPIRES_AT_MS: ${{ inputs.expires_at_ms }}
      MODE: ${{ inputs.mode }}
      CONTRACT: ${{ inputs.contract }}
      DIRECTION: ${{ inputs.direction }}
    steps:
      - name: Validate relay inputs and secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BOT_TOKEN:-}" && -n "${CHAT_ID:-}" ]] || { echo "GitHub Telegram relay secrets are missing."; exit 1; }
          [[ "$APPROVAL_ID" =~ ^[A-Za-z0-9_-]{10,64}$ ]] || { echo "Approval identifier is malformed."; exit 1; }
          [[ "$CORRELATION_ID" =~ ^[A-Za-z0-9_-]{16,64}$ ]] || { echo "Correlation identifier is malformed."; exit 1; }
          [[ "$EXPIRES_AT_MS" =~ ^[0-9]{13}$ ]] || { echo "Expiry is malformed."; exit 1; }

      - name: Relay the approval buttons and capture one matching reply
        id: relay
        shell: bash
        run: |
          set -euo pipefail
          now_ms="$(date +%s%3N)"
          if (( EXPIRES_AT_MS <= now_ms )); then
            echo "decision=EXPIRED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          initial="$(curl --silent --show-error --fail --max-time 20 --get "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" --data-urlencode "timeout=0")" || { echo "Telegram relay preflight failed."; exit 1; }
          offset="$(printf '%s' "$initial" | jq -r '[.result[]?.update_id] | if length == 0 then "" else (max + 1 | tostring) end')"
          message="SAMAR · ${MODE}\n${CONTRACT} ${DIRECTION}\n\nTap APPROVE or REJECT. HOSA will revalidate the signal locally before any position can open."

          keyboard="$(jq -cn --arg approve "hosa:${CORRELATION_ID}:approve" --arg reject "hosa:${CORRELATION_ID}:reject" '{inline_keyboard:[[ {text:"APPROVE",callback_data:$approve},{text:"REJECT",callback_data:$reject} ]]}' )"
          sent="$(curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${message}" --data-urlencode "reply_markup=${keyboard}")" || { echo "Telegram approval delivery failed."; exit 1; }
          printf '%s' "$sent" | jq -e '.ok == true' >/dev/null || { echo "Telegram rejected approval delivery."; exit 1; }
          message_id="$(printf '%s' "$sent" | jq -r '.result.message_id // empty')"
          [[ "$message_id" =~ ^[0-9]+$ ]] || { echo "Telegram approval delivery did not return a message id."; exit 1; }
          decision="EXPIRED"
          while (( $(date +%s%3N) < EXPIRES_AT_MS )); do
            args=(--silent --show-error --fail --max-time 20 --get "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" --data-urlencode "timeout=10")
            if [[ -n "$offset" ]]; then args+=(--data-urlencode "offset=${offset}"); fi
            updates="$(curl "${args[@]}")" || { echo "Telegram approval polling failed."; exit 1; }
            next_offset="$(printf '%s' "$updates" | jq -r '[.result[]?.update_id] | if length == 0 then "" else (max + 1 | tostring) end')"
            if [[ -n "$next_offset" ]]; then offset="$next_offset"; fi
            approve="hosa:${CORRELATION_ID}:approve"
            reject="hosa:${CORRELATION_ID}:reject"
            callback="$(printf '%s' "$updates" | jq -r --arg chat "$CHAT_ID" --arg approve "$approve" --arg reject "$reject" '[.result[]?.callback_query | select((((.message.chat.id? // "")|tostring) == $chat) and (((.from.id? // "")|tostring) == $chat) and (.data == $approve or .data == $reject))][0] // empty')"
            if [[ -n "$callback" ]]; then
              callback_id="$(printf '%s' "$callback" | jq -r '.id')"
              callback_data="$(printf '%s' "$callback" | jq -r '.data')"
              if [[ "$callback_data" == "$approve" ]]; then decision="APPROVE"; else decision="REJECT"; fi
              curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/answerCallbackQuery" --data-urlencode "callback_query_id=${callback_id}" --data-urlencode "text=HOSA received the decision. The buttons are now locked." >/dev/null || true
              closed_message="HOSA MOBILE APPROVAL\n\nDecision recorded: ${decision}\n\nThis message is closed. Further APPROVE or REJECT taps are disabled. HOSA must still validate the original approval locally before any Paper or Live action."
              closed_keyboard="$(jq -cn '{inline_keyboard:[]}')"
              curl --silent --show-error --fail --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "message_id=${message_id}" --data-urlencode "text=${closed_message}" --data-urlencode "reply_markup=${closed_keyboard}" >/dev/null || { echo "Telegram approval decision was received but the keyboard could not be disabled."; exit 1; }
              break
            fi
          done
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"

      - name: Write minimal relay result
        shell: bash
        env:
          DECISION: ${{ steps.relay.outputs.decision }}
        run: |
          set -euo pipefail
          jq -cn --arg approval_id "$APPROVAL_ID" --arg correlation_id "$CORRELATION_ID" --arg decision "$DECISION" '{schema_version:1,approval_id:$approval_id,correlation_id:$correlation_id,decision:$decision}' > decision.json

      - name: Upload minimal relay result
        uses: actions/upload-artifact@v4
        with:
          name: hosa-relay-${{ inputs.correlation_id }}
          path: decision.json
          if-no-files-found: error
          retention-days: 1
